<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Life Dashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon-192.png">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">LIFE DASHBOARD</div>
        <h1 id="pageTitle">Home</h1>
      </div>
      <div class="topbar-actions">
        <button id="searchButton" class="icon-button" aria-label="Search Life Dashboard" title="Search">⌕</button>
        <button id="inboxButton" class="icon-button" aria-label="Open inbox" title="Inbox">📥</button>
        <button id="settingsButton" class="icon-button" aria-label="Open settings" title="Settings">⚙️</button>
      </div>
    </header>

    <main id="app" class="app-content" aria-live="polite"></main>

    <button id="quickAddButton" class="fab" aria-label="Quick add">＋</button>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="home"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-item" data-view="tasks"><span class="nav-icon">✓</span><span>Tasks</span></button>
      <button class="nav-item" data-view="lists"><span class="nav-icon">☑</span><span>Lists</span></button>
      <button class="nav-item" data-view="plans"><span class="nav-icon">✈</span><span>Plans</span></button>
      <button class="nav-item" data-view="vault"><span class="nav-icon">▣</span><span>Vault</span></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
